# 本文件的版本用于资源维护；游戏版本每次从对应渠道的正式发布索引读取。
version = 1

type = "game"
id = "wuthering-waves"
game = "鸣潮"
default_channel = "cn"
default_quality = "HD"

[entrypoints]
catalog = "manifests/index.json"
icon = "icon.webp"
background = "background.webp"

# 下载列表用渠道的 name 和这里的画质名称展示；可用组合及版本由正式索引决定。
[quality_names]
SD = "标准画质"
HD = "高清画质"
UHD = "超高清画质"

# 仅在核实真实游戏文件及期望值后登记。示例和回归用例不能成为生产规则。
[risk_control]
rules = []

# 登记游戏主程序的相对路径，若为空则由用户现在决定。若索引中没有主程序，则无法启动游戏。
[main_routine]
src = ""

